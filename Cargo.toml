[package]
name = "nexa-windows-bridge"
version = "0.1.0"
edition = "2021"
description = "N.E.X.A Native Windows Desktop Companion for Lenovo ThinkPad X380 Yoga"
authors = ["Faqih", "N.E.X.A Team"]

[dependencies]
slint = "1.18.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
cpal = "0.15"
ringbuf = "0.4"
sonora = "0.2"
base64 = "0.23"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.18.1"
